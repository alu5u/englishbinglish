/* EnglishBinglish clean visual refresh */
:root{--navy:#17344d;--navy2:#24465d;--teal:#237f73;--teal2:#edf5f2;--ink:#202d36;--muted:#72808a;--line:#e6ebe9;--paper:#f7f9f8;--white:#fff;--gold:#c89a4b;--shadow:0 8px 24px rgba(23,52,77,.055);--radius:15px}
body{background:#f8faf9;color:var(--ink);font-size:14px}
.sidebar{width:238px;background:#fff;color:var(--ink);border-right:1px solid #e8edeb;padding:25px 16px}
.brand{gap:10px;padding:2px 8px 27px;align-items:center}
.brand-logo{width:43px;height:43px;object-fit:contain;flex:none}
.brand-wordmark{min-width:0}
.brand-name{font-size:17px;letter-spacing:-.65px;font-weight:820;color:#17344d;white-space:nowrap}
.brand-accent{color:#267f73;margin-left:3px}
.brand-tag{font-size:9px;letter-spacing:1.05px;color:#87958f;text-transform:uppercase;margin-top:2px}
.nav-label{color:#98a49f;font-size:9px;letter-spacing:1.4px}
.nav button{color:#5f6d76;border-radius:9px;padding:10px 11px;font-size:12px}
.nav button:hover{background:#f4f7f6;color:#17344d}
.nav button.active{background:#edf5f2;color:#1b625b;box-shadow:none}
.nav-ico{font-size:14px}
.side-foot{border-top:1px solid #e8edeb;color:#89958f;font-size:10px}
.side-foot b{color:#334b59;font-size:11px}
.main{margin-left:238px}
.topbar{height:64px;padding:0 34px;background:rgba(255,255,255,.96);border-bottom:1px solid #e8edeb;backdrop-filter:blur(10px)}
.content{max-width:1280px;padding:31px 36px 55px}
.crumb{font-size:12px}
.save-note{font-size:10px}
.avatar{background:#edf5f2;color:#1d6a60}
.home-intro{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.85fr);gap:42px;align-items:center;padding:10px 0 34px;border-bottom:1px solid #e7ece9}
.home-intro-copy{padding:14px 0}
.home-intro-copy .eyebrow{font-size:9px;letter-spacing:1.6px}
.home-intro-copy h1{font-size:37px;line-height:1.16;letter-spacing:-1.55px;color:#17344d;max-width:520px;margin:12px 0 13px;font-weight:760}
.home-intro-copy p{font-size:14px;line-height:1.75;color:#6d7b83;max-width:520px;margin:0}
.home-intro-actions{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-top:21px}
.home-private-note{font-size:10px;color:#8a9691}
.home-intro-photo{height:220px;border-radius:13px;overflow:hidden;background:#e8eeeb}
.home-intro-photo img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 42%}
.home-learning-areas{padding-top:28px}
.home-section-heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}
.home-section-heading .eyebrow{font-size:9px;letter-spacing:1.5px}
.home-section-heading h2{font-size:22px;line-height:1.25;letter-spacing:-.55px;color:#203b4c;margin:5px 0 4px}
.home-section-heading p{font-size:12px;color:#7c898e;margin:0}
.home-card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.home-area-card{background:#fff;border:1px solid #e6ece9;border-radius:13px;overflow:hidden;cursor:pointer;transition:border-color .18s,transform .18s,box-shadow .18s;min-width:0}
.home-area-card:hover,.home-area-card:focus-visible{border-color:#b9d1ca;transform:translateY(-2px);box-shadow:0 9px 22px rgba(23,52,77,.07);outline:none}
.home-area-image{height:145px;overflow:hidden;background:#edf1ef}
.home-area-image img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .3s}
.home-area-card:hover .home-area-image img{transform:scale(1.025)}
.home-area-body{padding:15px 16px 16px}
.home-area-number{font-size:9px;color:#91a19a;letter-spacing:1.3px;font-weight:750}
.home-area-body h3{font-size:17px;color:#1b394d;letter-spacing:-.25px;margin:4px 0 5px}
.home-area-body p{font-size:11px;line-height:1.65;color:#74818a;margin:0;min-height:37px}
.home-area-meta{font-size:10px;color:#6c817a;margin-top:12px;padding-top:10px;border-top:1px solid #eef1ef}
.home-area-link{font-size:11px;font-weight:750;color:#23786e;margin-top:11px;display:flex;justify-content:space-between;align-items:center}
.home-progress-footer{margin-top:25px;background:#fff;border:1px solid #e6ece9;border-radius:13px;padding:17px 19px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.home-progress-footer h2{font-size:16px;color:#1d394a;margin:4px 0}
.home-progress-footer p{font-size:10px;color:#84918c;margin:0}
.home-progress-side{width:190px;flex:none}
.home-progress-side strong{font-size:18px;color:#23796f}
.home-progress-track{height:5px;background:#edf1ef;border-radius:9px;overflow:hidden;margin:6px 0 12px}
.home-progress-track span{display:block;height:100%;background:#2c8a7e;border-radius:9px}
.home-footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;padding:0 2px;color:#97a19c;font-size:9px}

function streakDays(){let dates=[...new Set(state.activity.map(a=>new Date(a.at).toDateString()))];return dates.length}
function totalPoints(){return state.test.points.reduce((s,p)=>s+p.points,0)}
function renderTopicCards(items,kind){return `<div class="grid topic-grid">${items.map((t,i)=>{let done=state.learning[kind].completed.includes(t.id);let a=state.learning[kind].assets[t.id]||{};let progress=(a.video?1:0)+(a.read?1:0)+(a.quiz?1:0);return `<div class="card topic-card"><div class="badge-row"><span class="pill">${esc(t.group||t.skill||'Study topic')}</span>${done?'<span class="pill">Completed ✓</span>':''}</div><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p><div class="topic-foot"><span class="small-muted">${progress}/3 learning steps · ${t.duration||'20–30 min'}</span><button class="btn small ${done?'outline':''}" data-lesson="${kind}:${t.id}">${done?'Review':'Open topic'} →</button></div></div>`}).join('')}</div>`}
function pagesGrammar(){return `${pageHeader('LEARN · WORDS, SENTENCES & STRUCTURE','Grammar','One topic at a time. Watch a focused lesson, read a trusted reference and check your understanding.') }<div class="notice info">The starter pathway is organised into short lessons. The first video links are specific selections from engVid. Some later topics are marked for content review before publication.</div><div class="section-head"><div><h2>Word classes</h2><p>Build a foundation by understanding the work each word does.</p></div></div>${renderTopicCards(grammarTopics.filter(t=>t.group==='Word classes'), 'grammar')}<div class="section-head"><div><h2>Verb forms and sentence grammar</h2><p>Move from word-level grammar to sentence-level accuracy.</p></div></div>${renderTopicCards(grammarTopics.filter(t=>t.group!=='Word classes'),'grammar')}<div class="notice warn">Book references identify recommended study sources; EnglishBinglish does not distribute copyrighted book PDFs. Page and unit references will be matched when you confirm the exact editions you want to use.</div>`}
function pagesIelts(){let groups=['Listening','Reading','Writing','Speaking'];return `${pageHeader('EXAM PREPARATION · FOUR SKILLS','IELTS','Work through one question type at a time. Lessons link to selected videos, British Council skill guidance and official sample questions.')}<div class="notice info">IELTS practice scores on this site are learning indicators, not official IELTS band scores. Writing and speaking require rubric-based feedback; multiple-choice drills cannot measure all four IELTS criteria.</div>${groups.map(g=>`<div class="section-head"><div><h2>${g}</h2><p>${g==='Listening'?'Understand task types and follow the recording accurately.':g==='Reading'?'Read strategically and recognise paraphrase.':g==='Writing'?'Plan, organise and develop clear written responses.':'Build natural, relevant and developed spoken answers.'}</p></div></div>${renderTopicCards(ieltsTopics.filter(t=>t.skill===g),'ielts')}`).join('')}`}
function pagesCefr(){return `${pageHeader('LEVEL CHECK · A1 TO C2','CEFR','Get an indicative picture of your current English level, then use the guidance to plan your next steps.')}<div class="grid two-col"><div class="card"><div class="eyebrow">PART ONE · WRITTEN</div><h2 style="margin:7px 0 5px;font-size:20px">40-minute placement check</h2><p class="muted" style="font-size:12px">An original 20-question diagnostic covering grammar, vocabulary and language use. The timer starts when you begin; you may submit early.</p><div class="badge-row" style="margin:13px 0"><span class="pill">40 minutes</span><span class="pill">20 questions</span><span class="pill">Auto-submit</span></div><button class="btn" data-action="start-cefr">Begin written assessment →</button><p class="tiny" style="margin-top:12px">This is an informal CEFR-aligned self-assessment, not a Cambridge examination or certificate.</p></div><div class="card"><div class="eyebrow">PART TWO · SPEAKING</div><h2 style="margin:7px 0 5px;font-size:20px">Request a 10-minute speaking slot</h2><p class="muted" style="font-size:12px">Send a request to the administrator. A slot is not booked until the administrator confirms it by email.</p><button class="btn outline" data-action="speaking-request">Request a speaking slot →</button><p class="tiny" style="margin-top:12px">The site owner must configure a contact email before this feature is enabled.</p></div></div><div class="section-head"><div><h2>Your CEFR guidance</h2><p>Written result and speaking result can be reviewed together.</p></div></div><div class="card">${state.cefr.written?`<div class="grid stats" style="margin:0"><div><div class="stat-label">Written diagnostic</div><div class="stat-value">${state.cefr.written.score}/${state.cefr.written.total}</div><span class="pill">Indicative ${state.cefr.written.level}</span></div><div><div class="stat-label">Speaking assessment</div><div class="stat-value">${state.cefr.speaking?esc(state.cefr.speaking.level||'Recorded'):'Pending'}</div><span class="tiny">${state.cefr.speaking?'Result recorded from assessor feedback':'No result recorded yet'}</span></div></div><div class="notice">${cefrGuidance(state.cefr.speaking?lowerLevel(state.cefr.written.level,state.cefr.speaking.level):state.cefr.written.level)}</div><button class="btn outline small" data-action="record-speaking">${state.cefr.speaking?'Update speaking result':'Record speaking result received'}</button>`:`<div class="empty">Your written assessment result will appear here. Complete the 40-minute check to receive indicative guidance.</div>`}</div><div class="section-head"><div><h2>CEFR reference levels</h2><p>Use these descriptors to understand the broad progression.</p></div></div><div class="level-grid">${[['A1','Beginner'],['A2','Elementary'],['B1','Intermediate'],['B2','Upper-intermediate'],['C1','Advanced'],['C2','Proficient']].map(x=>`<div class="level"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div>`}
function lowerLevel(a,b){let levels=['A1','A2','B1','B2','C1','C2'];return levels[Math.min(levels.indexOf(a),levels.indexOf(b))]||a}
function cefrGuidance(level){let d={A1:'Focus on everyday vocabulary, basic sentence patterns, be/have/do, simple present and simple past. Use short listening and reading texts.',A2:'Strengthen everyday communication, past and future forms, common comparatives, modals and short connected writing.',B1:'Develop independent communication, narrative tenses, present perfect, conditionals, paragraph organisation and regular listening practice.',B2:'Work on complex grammar, collocations, extended argument, detailed reading and fluent discussion of abstract topics.',C1:'Focus on precision, register, nuance, advanced collocation, academic argument and complex spoken interaction.',C2:'Maintain high-level accuracy and flexibility through demanding academic and professional texts, stylistic control and nuanced discussion.'};return d[level]||'Continue with balanced practice in grammar, vocabulary, reading, listening, speaking and writing.'}

function pagesTest(){return `${pageHeader('INDEPENDENT PRACTICE · EARN POINTS','TEST','A separate 10-minute challenge. Your TEST points do not change your Grammar, IELTS, CEFR or MA learning progress.')}<div class="points-hero"><div><small>YOUR LIFETIME TEST POINTS</small><strong>${totalPoints()} <span style="font-size:14px;font-weight:600">pts</span></strong><small>One point for every correct answer</small></div><div style="text-align:right"><small>Tests attempted</small><strong style="font-size:25px">${state.test.attempts.length}</strong></div></div><div class="grid stats" style="margin-top:14px"><div class="card"><div class="stat-label">This week</div><div class="stat-value">${periodPoints('week')} pts</div></div><div class="card"><div class="stat-label">This month</div><div class="stat-value">${periodPoints('month')} pts</div></div><div class="card"><div class="stat-label">Correct answers</div><div class="stat-value">${state.test.points.reduce((s,p)=>s+p.points,0)}</div></div><div class="card"><div class="stat-label">Personal best</div><div class="stat-value">${Math.max(0,...state.test.attempts.map(a=>a.score))}/20</div></div></div><div class="section-head"><div><h2>Choose your test</h2><p>Select a subject, then select a topic or paper.</p></div></div><div class="card"><div class="form-grid"><div class="field"><label for="testSubject">Subject</label><select id="testSubject"><option value="grammar">Grammar</option><option value="ielts">IELTS</option><option value="cefr">CEFR</option><option value="ma">MA in English</option></select></div><div class="field"><label for="testTopic">Topic / skill / paper</label><select id="testTopic"></select></div></div><div class="notice info" style="margin:15px 0 13px">20 questions · 10 minutes · +1 point per correct answer. Answered questions are retired for this learner; skipped questions remain eligible for a later test.</div><button class="btn" id="startQuickTest">Start 10-minute test →</button><p class="tiny" style="margin-top:11px">The first release uses a prepared original question bank. It does not call a live AI API, so it can remain free to host. Additional question packs can be added over time.</p></div><div class="section-head"><div><h2>My TEST history</h2><p>Independent of your learning-section progress.</p></div></div><div class="card">${state.test.attempts.length?`<div class="score-list">${state.test.attempts.slice(0,8).map(a=>`<div class="score-line"><span><b>${esc(a.label)}</b><br><span class="tiny">${new Date(a.at).toLocaleDateString()}</span></span><span><b>${a.score}/20</b> · ${a.points} pts</span></div>`).join('')}</div>`:'<div class="empty">Your completed quick tests will appear here.</div>'}</div><div class="notice warn">Weekly and monthly points shown here are personal totals on this device. A shared public leaderboard requires a shared database and is not included in this free static release. MA paper-specific TEST banks remain inactive until the current NU reading list is confirmed.</div>`}
function periodPoints(period){let now=new Date();return state.test.points.filter(p=>{let d=new Date(p.at);if(period==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();let start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));start.setHours(0,0,0,0);return d>=start}).reduce((s,p)=>s+p.points,0)}
function pagesResources(){return `${pageHeader('CURATED LINKS · OPEN LEARNING','Free Resources','A growing directory of selected videos, official sample materials and open academic-learning support.')}<div class="grid resource-grid">${resources.map(r=>`<div class="card resource-tile"><div class="badge-row"><span class="pill">${r.type}</span></div><div class="path-symbol">${r.icon}</div><h3>${r.name}</h3><p>${r.desc}</p><a href="${r.url}" target="_blank" rel="noopener">Open resource ↗</a></div>`).join('')}</div><div class="notice">Resources are linked to their original publishers. Availability, access terms and free-content status are controlled by the respective providers.</div>`}
function pagesProgress(){let gs=state.learning.grammar,il=state.learning.ielts,ma=state.learning.ma;let st=learningStats();return `${pageHeader('YOUR RECORD · SAVED LOCALLY','My Progress','Review your learning activity and completed learning topics. TEST points are tracked separately in the TEST section.')}<div class="grid stats"><div class="card"><div class="stat-label">All learning topics</div><div class="stat-value">${st.done}/${st.total}</div><div class="progress-line"><span style="width:${st.p}%"></span></div></div><div class="card"><div class="stat-label">Grammar completed</div><div class="stat-value">${gs.completed.length}/${grammarTopics.length}</div></div><div class="card"><div class="stat-label">IELTS completed</div><div class="stat-value">${il.completed.length}/${ieltsTopics.length}</div></div></div><div class="grid two-col"><div class="card"><h3 style="margin:0 0 12px;font-size:14px">Learning section progress</h3>${[['Grammar',gs.completed.length,grammarTopics.length],['IELTS',il.completed.length,ieltsTopics.length],['MA in English',ma.completed.length,maPapers.length]].map(x=>`<div style="margin:13px 0"><div class="score-line" style="border:0;padding:0"><b>${x[0]}</b><span>${x[1]}/${x[2]}</span></div><div class="progress-line"><span style="width:${pct(x[1],x[2])}%"></span></div></div>`).join('')}<div class="notice info">CEFR written diagnostic: ${state.cefr.written?`${state.cefr.written.score}/${state.cefr.written.total} · indicative ${state.cefr.written.level}`:'Not attempted'}.</div></div><div class="card"><h3 style="margin:0 0 12px;font-size:14px">Backup and restore</h3><p class="muted" style="font-size:11px">Your progress is stored in this browser. Download a backup before changing devices or clearing browser data.</p><button class="btn" data-action="export">Download progress backup</button><div class="divider"></div><label class="btn outline" for="restoreFile">Restore from backup</label><input class="hidden" type="file" id="restoreFile" accept="application/json"><div class="notice warn">This free version does not use learner accounts or cloud sync. Your records are private to this browser profile.</div><button class="btn danger small" data-action="reset">Reset all local progress</button></div></div><div class="section-head"><div><h2>Recent activity</h2><p>Your latest study actions.</p></div></div><div class="card">${state.activity.length?state.activity.slice(0,10).map(a=>`<div class="score-line"><span>${esc(a.text)}</span><span class="tiny">${new Date(a.at).toLocaleString()}</span></div>`).join(''):'<div class="empty">No activity yet. Open a topic to get started.</div>'}</div>`}
const pages={home:pagesHome,grammar:pagesGrammar,ielts:pagesIelts,cefr:pagesCefr,ma:pagesMA,test:pagesTest,resources:pagesResources,progress:pagesProgress};
function renderLesson(kind,id){let t=(kind==='grammar'?grammarTopics:kind==='ielts'?ieltsTopics:maPapers).find(x=>x.id===id);if(!t)return;currentLesson={kind,id};let asset=state.learning[kind].assets[id]||{};let video=t.video||'';let videoTitle=t.videoTitle||'A specific topic video will be added after review';let read=t.article||'https://owl.purdue.edu/owl/';let bRef=t.book||'Start with the prescribed primary text and your department reading list.';
let body=`<button class="btn outline small" data-go="${kind}" style="margin-bottom:15px">← Back to ${kind==='ma'?'MA in English':kind.toUpperCase()}</button><div class="eyebrow">${kind==='grammar'?'GRAMMAR LESSON':kind==='ielts'?'IELTS SKILL LESSON':'ACADEMIC PAPER'}</div><h1 class="page-title">${esc(t.title)}</h1><p class="sub">${esc(t.desc)}</p><div class="grid lesson-layout" style="margin-top:20px"><div class="card"><div class="eyebrow">LEARN · STEP 1</div><h2 style="font-size:17px;margin:7px 0">Watch the lesson</h2><div class="resource-card"><div class="resource-icon">▶</div><div><b>${esc(videoTitle)}</b><small>${video?'A specific video selected for this topic.':'The creator will add a topic-specific direct video link before this lesson is marked fully curated.'}</small><br>${video?`<a href="${video}" target="_blank" rel="noopener">Watch selected video ↗</a>`:'<span class="tiny">Video link pending content review</span>'}</div></div><div class="eyebrow" style="margin-top:20px">READ · STEP 2</div><h2 style="font-size:17px;margin:7px 0">Study material</h2><p class="muted" style="font-size:12px">${esc(bRef)}</p><div class="resource-card"><div class="resource-icon">▤</div><div><b>${kind==='ielts'?'British Council / IELTS reference':'Trusted grammar or academic reference'}</b><small>Use this reference alongside your notes.</small><br><a href="${read}" target="_blank" rel="noopener">Open study reference ↗</a></div></div>${kind==='ielts'&&t.extra?`<div class="resource-card"><div class="resource-icon">✓</div><div><b>Official IELTS sample questions</b><small>Use official samples for format familiarisation.</small><br><a href="${t.extra}" target="_blank" rel="noopener">Open sample questions ↗</a></div></div>`:''}<div class="eyebrow" style="margin-top:20px">REFLECT · STEP 3</div><h2 style="font-size:17px;margin:7px 0">Your learning checklist</h2><label class="checkline"><input type="checkbox" data-asset="video" ${asset.video?'checked':''}> <span><b>Video lesson watched</b><br><span class="tiny">I watched the linked explanation and noted key points.</span></span></label><label class="checkline"><input type="checkbox" data-asset="read" ${asset.read?'checked':''}> <span><b>Study material reviewed</b><br><span class="tiny">I read the reference and made short notes.</span></span></label><label class="checkline"><input type="checkbox" data-asset="quiz" ${asset.quiz?'checked':''}> <span><b>Topic assessment completed</b><br><span class="tiny">Complete the topic quiz to check your understanding.</span></span></label><div class="notice info" style="margin-top:14px">${kind==='grammar'&&id==='parts-of-speech'?'This first lesson has a dedicated 20-question assessment.':'A foundation practice set is available now. A fully topic-specific 20-question set will be added after the remaining lesson questions are curated. This practice does not complete the topic checklist.'}</div><button class="btn" style="margin-top:5px" data-action="lesson-quiz">${kind==='grammar'&&id==='parts-of-speech'?'Start 20-question topic quiz →':'Start foundation practice →'}</button></div><div class="card"><div class="eyebrow">YOUR TOPIC PROGRESS</div><h3 style="font-size:16px;margin:7px 0">${esc(t.title)}</h3><div class="grid stats" style="grid-template-columns:1fr 1fr;margin:13px 0"><div><div class="stat-label">Best score</div><div class="stat-value">${asset.best??'—'}${asset.best!==undefined?'%':''}</div></div><div><div class="stat-label">Attempts</div><div class="stat-value">${asset.attempts||0}</div></div></div><div class="notice">Complete the video, reference reading and topic assessment to mark this topic as complete.</div><button class="btn ${state.learning[kind].completed.includes(id)?'outline':''}" data-action="mark-topic" ${asset.video&&asset.read&&asset.quiz?'':'disabled'}>${state.learning[kind].completed.includes(id)?'Topic completed ✓':'Mark topic complete'}</button><p class="tiny" style="margin-top:12px">Topic assessments update this learning section only. They do not award TEST points.</p></div></div>`;
 document.getElementById('app').innerHTML=body;setCrumb(t.title);bindGlobal();}
function questionsFor(kind,id){if(kind==='grammar'&&id==='parts-of-speech')return partsOfSpeechBank;if(kind==='grammar')return grammarBank.slice(0,20);if(kind==='ielts')return ieltsBank.slice(0,20);return maBank.slice(0,20)}
function startQuiz(mode,kind,id,questions,label,duration,points){clearInterval(timerHandle);let qs=shuffle(questions).slice(0,20);activeQuiz={mode,kind,id,questions:qs,label,duration,remaining:duration*60,answers:{},index:0,points,topicSpecific:mode==='lesson'&&kind==='grammar'&&id==='parts-of-speech'};renderQuiz();timerHandle=setInterval(()=>{if(!activeQuiz)return;activeQuiz.remaining--;let el=document.getElementById('timer');if(el)el.textContent=formatTime(activeQuiz.remaining);if(activeQuiz.remaining<=0)finishQuiz(true)},1000)}
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function formatTime(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function renderQuiz(){let qx=activeQuiz;if(!qx)return;let q=qx.questions[qx.index];let app=document.getElementById('app');app.innerHTML=`<div class="quiz-shell"><button class="btn outline small" data-action="leave-quiz">← Leave test</button><div class="quiz-top" style="margin-top:18px"><div><div class="eyebrow">${qx.mode==='quick'?'INDEPENDENT TEST':'LEARNING ASSESSMENT'}</div><h1 class="page-title" style="font-size:23px">${esc(qx.label)}</h1><div class="tiny">Question ${qx.index+1} of ${qx.questions.length} · ${qx.mode==='quick'?'10 minutes':qx.mode==='cefr'?'40-minute placement':'Topic practice'}</div></div><div class="timer" id="timer">${formatTime(qx.remaining)}</div></div><div class="q-progress"><span style="width:${(qx.index+1)/qx.questions.length*100}%"></span></div><div class="card"><div class="badge-row"><span class="pill">${esc(q.level||'Practice')}</span><span class="pill grey">${qx.answers[q.id]===undefined?'Not answered':'Answer selected'}</span></div><div class="question">${esc(q.text)}</div><div class="options">${q.opts.map((o,i)=>`<button class="option ${qx.answers[q.id]===i?'selected':''}" data-answer="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="quiz-actions"><button class="btn outline" data-action="prev-question" ${qx.index===0?'disabled':''}>← Previous</button><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn outline" data-action="skip-question">Skip</button><button class="btn outline" data-action="submit-quiz">Submit now</button><button class="btn" data-action="next-question">${qx.index===qx.questions.length-1?'Submit & finish':'Next question →'}</button></div></div><div class="q-dots">${qx.questions.map((x,i)=>`<button class="q-dot ${i===qx.index?'current':''} ${qx.answers[x.id]!==undefined?'answered':''}" data-qindex="${i}">${i+1}</button>`).join('')}</div></div><div class="tiny" style="margin-top:12px">${qx.mode==='quick'?'Only answered questions are retired from your future personal question pool. Skipped questions can appear again.':qx.mode==='cefr'?'This informal diagnostic is stored in your CEFR section. It does not award TEST points.':'This assessment is part of your '+(qx.kind==='grammar'?'Grammar':qx.kind==='ielts'?'IELTS':'MA in English')+' learning record, not the separate TEST points system.'}</div></div>`;setCrumb('Assessment in progress');bindGlobal()}
function finishQuiz(auto=false){if(!activeQuiz)return;clearInterval(timerHandle);let qx=activeQuiz;let correct=0,answered=0;qx.questions.forEach(q=>{if(qx.answers[q.id]!==undefined){answered++;if(qx.answers[q.id]===q.ans)correct++}});let skipped=qx.questions.length-answered;let percent=pct(correct,qx.questions.length);let pts=qx.mode==='quick'?correct:0;
 if(qx.mode==='quick'){
  qx.questions.forEach(q=>{if(qx.answers[q.id]!==undefined){let key=qx.kind+':'+qx.id;state.test.history[key]=state.test.history[key]||[];if(!state.test.history[key].includes(q.id))state.test.history[key].push(q.id);state.test.answeredIds=state.test.answeredIds||[];if(!state.test.answeredIds.includes(q.id))state.test.answeredIds.push(q.id);state.test.answeredTexts=state.test.answeredTexts||[];let fingerprint=questionFingerprint(q.text);if(fingerprint&&!state.test.answeredTexts.includes(fingerprint))state.test.answeredTexts.push(fingerprint)}});
  state.test.points.push({points:pts,at:new Date().toISOString(),label:qx.label});state.test.attempts.unshift({score:correct,points:pts,at:new Date().toISOString(),label:qx.label,answered,skipped});
 }else{
  if(qx.mode==='lesson'){let bucket=state.learning[qx.kind];let a=bucket.assets[qx.id]||{};if(qx.topicSpecific){a.quiz=true;a.best=Math.max(a.best||0,percent);a.attempts=(a.attempts||0)+1;bucket.assets[qx.id]=a;bucket.scores[qx.id]=percent;bucket.attempts++;}else{a.practiceBest=Math.max(a.practiceBest||0,percent);a.practiceAttempts=(a.practiceAttempts||0)+1;bucket.assets[qx.id]=a;}}}
 if(qx.kind==='cefr'){let level=correct<5?'A1':correct<8?'A2':correct<11?'B1':correct<15?'B2':correct<18?'C1':'C2';state.cefr.written={score:correct,total:qx.questions.length,level,at:new Date().toISOString()}}
 if(qx.mode!=='quick')logActivity('Assessment: '+qx.label+' — '+correct+'/'+qx.questions.length);save();activeQuiz=null;renderResult(qx,correct,answered,skipped,percent,pts,auto)}
function renderResult(qx,correct,answered,skipped,percent,pts,auto){let app=document.getElementById('app');app.innerHTML=`<div class="quiz-shell"><div class="card" style="text-align:center;padding:28px"><div class="eyebrow">${auto?'TIME EXPIRED · ':''}ASSESSMENT COMPLETE</div><h1 class="page-title">${qx.mode==='quick'?'Your TEST result':qx.mode==='cefr'?'Your CEFR diagnostic result':'Your topic result'}</h1><div class="result-score">${correct}/${qx.questions.length}</div><div style="font-size:12px;color:var(--muted)">${percent}% correct · ${answered} answered · ${skipped} skipped</div>${qx.mode==='quick'?`<div class="notice" style="margin:16px auto;max-width:320px"><b>+${pts} points</b> added to your lifetime TEST score.</div>`:qx.mode==='cefr'?`<div class="notice" style="margin:16px auto;max-width:420px"><b>Indicative level: ${state.cefr.written.level}</b><br>${cefrGuidance(state.cefr.written.level)}<br><small>This is an informal diagnostic, not an official CEFR certificate.</small></div>`:`<div class="notice" style="margin:16px auto;max-width:420px">${qx.topicSpecific?'Your topic assessment has been saved to this learning topic. No TEST points were awarded.':'Your foundation practice result has been recorded. It does not mark the individual topic complete. No TEST points were awarded.'}</div>`}<button class="btn" data-action="review-answers">Review answers and explanations</button> <button class="btn outline" data-go="${qx.mode==='quick'?'test':qx.kind}">Return to section</button></div><div class="card" style="margin-top:14px"><h3 style="font-size:14px;margin:0 0 9px">Answer review</h3>${qx.questions.map((q,i)=>`<div class="review"><b>${i+1}. ${esc(q.text)}</b><p>Your answer: ${qx.answers[q.id]===undefined?'<i>Not answered</i>':esc(q.opts[qx.answers[q.id]])} · Correct answer: <b style="color:var(--teal)">${esc(q.opts[q.ans])}</b></p><p>${esc(q.exp)}</p></div>`).join('')}</div></div>`;setCrumb('Assessment result');bindGlobal()}
function renderQuickTest(){let sub=document.getElementById('testSubject'),topic=document.getElementById('testTopic');if(!sub||!topic)return;let map={grammar:[...grammarTopics.map(x=>[x.id,x.title]),['foundations','General Grammar · mixed starter set']],ielts:[['essentials','IELTS foundations · mixed skills'],...ieltsTopics.map(x=>[x.id,x.title])],cefr:[['language-use','Language use · mixed diagnostic']],ma:maPapers.map(x=>[x.id,x.title])};let fill=()=>{topic.innerHTML=map[sub.value].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')};fill();sub.addEventListener('change',fill);document.getElementById('startQuickTest').addEventListener('click',()=>{let kind=sub.value,id=topic.value,key=kind+':'+id;let bank=null;if(kind==='grammar'&&id==='parts-of-speech')bank=partsOfSpeechBank;else if(kind==='grammar'&&id==='foundations')bank=grammarBank;else if(kind==='ielts'&&id==='essentials')bank=ieltsBank;else if(kind==='cefr'&&id==='language-use')bank=cefrBank;if(!bank){showModal('Question pack being prepared','This test category is listed in the EnglishBinglish structure, but its dedicated 20-question assessment pack has not yet been quality-checked and published. It will be activated when its topic-specific questions and explanations are ready.');return;}let seen=state.test.answeredIds||[];let seenTexts=state.test.answeredTexts||[];let fresh=bank.filter(x=>!seen.includes(x.id)&&!seenTexts.includes(questionFingerprint(x.text)));if(fresh.length<20){showModal('Question bank nearly used','There are only '+fresh.length+' unanswered-by-you questions left in this topic. Answered items are retired permanently for this browser profile. A new question pack is needed before another full 20-question test can be offered.');return;}startQuiz('quick',kind,id,shuffle(fresh).slice(0,20),`${sub.options[sub.selectedIndex].text} · Quick Test`,10,true)})}
function showModal(htmlTitle,htmlBody,actions=''){let back=document.getElementById('modalBack'),m=document.getElementById('modal');m.innerHTML=`<h2>${htmlTitle}</h2>${htmlBody}<div class="modal-actions">${actions||'<button class="btn" data-close>Close</button>'}</div>`;back.classList.add('show');m.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>back.classList.remove('show'));}
function openSpeaking(){let mail=SPEAKING_CONTACT_EMAIL;let body=`<p>Request a 10-minute speaking assessment slot. The request will open your email application; the administrator must confirm the time separately.</p><div class="form-grid"><div class="field"><label>Your name</label><input id="spName" value="${esc(state.profile.name)}"></div><div class="field"><label>Your email</label><input id="spEmail" type="email" placeholder="you@example.com"></div><div class="field"><label>Current estimated level</label><select id="spLevel"><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option><option>Not sure</option></select></div><div class="field"><label>Preferred time</label><input id="spTime" placeholder="e.g. Friday evening"></div><div class="field full"><label>Anything you want the assessor to know?</label><textarea id="spNote" placeholder="Optional"></textarea></div></div>${mail?'<p class="tiny">Request will be addressed to the configured admin email.</p>':'<div class="notice warn">The site owner has not configured a speaking-assessment contact email yet.</div>'}`;showModal('Request a speaking slot',body,`<button class="btn outline" data-close>Cancel</button><button class="btn" id="sendSpeaking" ${mail?'':'disabled'}>Prepare email →</button>`);document.getElementById('sendSpeaking')?.addEventListener('click',()=>{let n=document.getElementById('spName').value,e=document.getElementById('spEmail').value;if(!n||!e){alert('Please enter your name and email.');return}let text=`Speaking assessment request\nName: ${n}\nEmail: ${e}\nEstimated level: ${document.getElementById('spLevel').value}\nPreferred time: ${document.getElementById('spTime').value}\nNotes: ${document.getElementById('spNote').value}`;location.href='mailto:'+mail+'?subject='+encodeURIComponent('EnglishBinglish speaking slot request')+'&body='+encodeURIComponent(text);document.getElementById('modalBack').classList.remove('show')})}
function recordSpeakingResult(){let body=`<p>Enter the CEFR level provided by the assessor after your speaking appointment. This records the result locally so the guidance can consider both assessments.</p><div class="field"><label>Assessor's reported level</label><select id="speakingLevel"><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option></select></div><div class="notice warn">Only enter a level after an actual speaking assessment. This website does not award or verify CEFR certificates.</div>`;showModal('Record speaking result',body,`<button class="btn outline" data-close>Cancel</button><button class="btn" id="saveSpeakingResult">Save result</button>`);document.getElementById('saveSpeakingResult').onclick=()=>{state.cefr.speaking={level:document.getElementById('speakingLevel').value,at:new Date().toISOString()};logActivity('Recorded speaking assessment level: '+state.cefr.speaking.level);save();document.getElementById('modalBack').classList.remove('show');nav('cefr')}}
function openProfile(){let body=`<div class="field"><label>Display name / nickname</label><input id="profileName" value="${esc(state.profile.name)}" maxlength="40"></div><div class="notice info">Your nickname and learning records are saved only in this browser. This first release does not require an account. The speaking-request contact is configured by the site owner, not by learners.</div>`;showModal('Your profile & settings',body,`<button class="btn outline" data-close>Cancel</button><button class="btn" id="saveProfile">Save settings</button>`);document.getElementById('saveProfile').onclick=()=>{state.profile.name=document.getElementById('profileName').value.trim()||'Learner';save();document.getElementById('modalBack').classList.remove('show');render()}}
function exportBackup(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='englishbinglish-progress-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(file){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.learning||!x.test)throw new Error('Invalid');state={...defaultState,...x};save();render();alert('Progress restored successfully.')}catch(e){alert('This file is not a valid EnglishBinglish backup.')}};r.readAsText(file)}
function markAsset(asset,checked){if(!currentLesson)return;let {kind,id}=currentLesson;state.learning[kind].assets[id]=state.learning[kind].assets[id]||{};state.learning[kind].assets[id][asset]=checked;save();renderLesson(kind,id)}
function markTopic(){let {kind,id}=currentLesson;if(!kind||!id)return;let a=state.learning[kind].assets[id]||{};if(!(a.video&&a.read&&a.quiz))return;if(!state.learning[kind].completed.includes(id))state.learning[kind].completed.push(id);logActivity('Completed '+(kind==='grammar'?'Grammar':kind==='ielts'?'IELTS':'MA')+' topic: '+id);save();renderLesson(kind,id)}
function openMaPaper(id){let p=maPapers.find(x=>x.id===id);if(!p)return;currentLesson={kind:'ma',id};let a=state.learning.ma.assets[id]||{};document.getElementById('app').innerHTML=`<button class="btn outline small" data-go="ma">← Back to MA papers</button><div class="eyebrow" style="margin-top:18px">MA IN ENGLISH · STUDY PAPER</div><h1 class="page-title">${esc(p.title)}</h1><p class="sub">${esc(p.desc)}</p><div class="grid two-col" style="margin-top:20px"><div class="card"><h3 style="font-size:15px">Study sequence</h3><div class="checkline"><input type="checkbox" data-asset="video" ${a.video?'checked':''}><span><b>Lecture / recorded class reviewed</b><br><span class="tiny">Add a lecturer-recommended lecture link when available.</span></span></div><div class="checkline"><input type="checkbox" data-asset="read" ${a.read?'checked':''}><span><b>Prescribed text read</b><br><span class="tiny">Use your current NU reading list and a reliable edition.</span></span></div><div class="checkline"><input type="checkbox" data-asset="quiz" ${a.quiz?'checked':''}><span><b>Revision questions completed</b><br><span class="tiny">MA paper-specific question sets are being prepared.</span></span></div><p class="tiny">The paper outline is provisional until checked against your current NU syllabus.</p><button class="btn" data-action="mark-topic" ${a.video&&a.read&&a.quiz?'':'disabled'}>Mark paper study complete</button></div><div class="card"><h3 style="font-size:15px">Study resources</h3><p class="muted" style="font-size:12px">Start with the prescribed primary text. Use literary criticism to support—not replace—your own close reading.</p><a href="https://www.folger.edu/explore/shakespeares-works/" target="_blank">Folger Shakespeare Library ↗</a><div class="divider"></div><a href="https://www.gutenberg.org/" target="_blank">Project Gutenberg ↗</a><div class="divider"></div><a href="https://owl.purdue.edu/owl/" target="_blank">Purdue OWL ↗</a></div></div>`;setCrumb(p.title);bindGlobal()}
function bindGlobal(){
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{let p=b.dataset.go;nav(p);if(b.dataset.topic){let k=p==='ielts'?'ielts':'grammar';renderLesson(k,b.dataset.topic)}});
 document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{let [k,id]=b.dataset.lesson.split(':');renderLesson(k,id)});
 document.querySelectorAll('[data-ma]').forEach(b=>b.onclick=()=>openMaPaper(b.dataset.ma));
 document.querySelectorAll('[data-asset]').forEach(b=>b.onchange=()=>markAsset(b.dataset.asset,b.checked));
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(!activeQuiz)return;let q=activeQuiz.questions[activeQuiz.index];activeQuiz.answers[q.id]=Number(b.dataset.answer);renderQuiz()});
 document.querySelectorAll('[data-qindex]').forEach(b=>b.onclick=()=>{if(activeQuiz){activeQuiz.index=Number(b.dataset.qindex);renderQuiz()}});
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
 document.getElementById('profileBtn').onclick=openProfile;
 if(currentPage==='test')renderQuickTest();
 let restore=document.getElementById('restoreFile');if(restore)restore.onchange=()=>{if(restore.files[0])importBackup(restore.files[0])};
}
function action(a){if(a==='export')exportBackup();if(a==='reset'){if(confirm('Delete all EnglishBinglish progress saved in this browser? Download a backup first if you may need it.')){state=structuredClone(defaultState);save();render()}}if(a==='start-cefr'){startQuiz('cefr','cefr','placement',cefrPlacement,'CEFR 40-minute placement check',40,false)}if(a==='speaking-request')openSpeaking();if(a==='record-speaking')recordSpeakingResult();if(a==='mark-topic')markTopic();if(a==='lesson-quiz'){let {kind,id}=currentLesson;let qs=questionsFor(kind,id);startQuiz('lesson',kind,id,qs,`${id.replace(/-/g,' ')} · ${kind==='grammar'&&id==='parts-of-speech'?'Topic assessment':'Foundation practice'}`,20,false)}if(a==='submit-quiz'&&activeQuiz){if(confirm('Submit this assessment now? Unanswered questions will remain unanswered.'))finishQuiz(false)}if(a==='prev-question'&&activeQuiz&&activeQuiz.index>0){activeQuiz.index--;renderQuiz()}if(a==='next-question'&&activeQuiz){if(activeQuiz.index===activeQuiz.questions.length-1){if(confirm('Finish and submit your answers?'))finishQuiz(false)}else{activeQuiz.index++;renderQuiz()}}if(a==='skip-question'&&activeQuiz){if(activeQuiz.index===activeQuiz.questions.length-1)finishQuiz(false);else{activeQuiz.index++;renderQuiz()}}if(a==='leave-quiz'&&activeQuiz){if(confirm('Leave this test? Your current answers will not be scored.')){clearInterval(timerHandle);activeQuiz=null;nav('home')}}if(a==='review-answers')document.querySelectorAll('.review').forEach(x=>x.style.background='#f9fbfa');if(a==='reading-note'){showModal('Create a reading note','<div class="field"><label>Paper / text</label><input id="notePaper" placeholder="e.g. Shakespeare"></div><div class="field" style="margin-top:9px"><label>Your note</label><textarea id="noteText" placeholder="Record a quotation, theme, question or critical observation"></textarea></div>',`<button class="btn outline" data-close>Cancel</button><button class="btn" id="saveNote">Save note</button>`);document.getElementById('saveNote').onclick=()=>{let notes=JSON.parse(localStorage.getItem('eb_notes')||'[]');notes.unshift({paper:document.getElementById('notePaper').value,text:document.getElementById('noteText').value,at:new Date().toISOString()});localStorage.setItem('eb_notes',JSON.stringify(notes));document.getElementById('modalBack').classList.remove('show');alert('Reading note saved on this device.')}}}
document.getElementById('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')e.currentTarget.classList.remove('show')});
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
})();
</script>
</body>
</html>
